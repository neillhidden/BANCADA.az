name: Publish storefront to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storefront-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:pages
      - name: Update generated gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          pages_artifact_dir="$(mktemp -d)"
          cp -a dist-pages/. "$pages_artifact_dir/"
          touch "$pages_artifact_dir/.nojekyll"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -r --ignore-unmatch .
          cp -a "$pages_artifact_dir/." .
          git add index.html .nojekyll assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish storefront from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
